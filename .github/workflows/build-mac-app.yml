name: Build macOS app

# Builds the .app on a macOS runner. On a version tag (vX.Y.Z) it attaches the
# zipped app to a GitHub Release; on manual runs it uploads a build artifact.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # required to create/update Releases

jobs:
  build:
    runs-on: macos-14   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller==6.11.1

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Build the app
        run: pyinstaller --noconfirm PatientListDedup.spec

      - name: Zip the app bundle
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent \
            "PatientListDedup.app" "PatientListDedup-macos-arm64.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PatientListDedup-macos-arm64
          path: dist/PatientListDedup-macos-arm64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PatientListDedup-macos-arm64.zip
          body: |
            ## Patient List Dedup — macOS app (Apple Silicon)

            1. Download `PatientListDedup-macos-arm64.zip` below and unzip it.
            2. First launch (the app is unsigned): **right-click the app → Open → Open**,
               or run `xattr -dr com.apple.quarantine PatientListDedup.app` once.
            3. Choose a CSV, pick options, and save the deduplicated result.

            All processing is local — no patient data leaves the machine.
